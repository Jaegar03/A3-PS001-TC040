# CI for SENTIVRA: backend (ruff + pytest) and frontend (eslint + tsc + build).
# No secrets, no external services, no production data: the backend test suite
# provisions its own temporary SQLite database and explicit test clients
# (backend/tests/conftest.py), so nothing here touches a developer's
# ./sentivra.db or .sentivra/ state.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: pytest -q

  frontend:
    name: Frontend (eslint, tsc, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (lockfile)
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      # Build before the standalone type check: Next generates the route
      # types (LayoutProps etc.) that `tsc --noEmit` needs during the build.
      - name: Production build
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit
